<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusFlow — Deep Work Timer</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="bg-canvas">
    <div class="bg-grain"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="flash" id="flash"></div>
  <div class="toast" id="toast"></div>

  <div class="app">
    <div class="logo">FocusFlow</div>

    <div class="modes">
      <button class="mode-btn active" data-mode="focus" onclick="setMode('focus')">Focus</button>
      <button class="mode-btn" data-mode="short" onclick="setMode('short')">Short Break</button>
      <button class="mode-btn" data-mode="long" onclick="setMode('long')">Long Break</button>
    </div>

    <div class="timer-wrap">
      <svg class="ring-svg" id="ringSvg" width="280" height="280" viewBox="0 0 280 280">
        <circle class="ring-track" cx="140" cy="140" r="128"/>
        <circle class="ring-progress" id="ringProgress" cx="140" cy="140" r="128"
          stroke-dasharray="804.25" stroke-dashoffset="0"/>
      </svg>
      <div class="timer-center">
        <div class="timer-display" id="timerDisplay">20:00</div>
        <div class="timer-label" id="timerLabel">Focus Session</div>
      </div>
    </div>

    <p class="edit-hint" id="editHint">click time to edit</p>

    <div class="task-wrap">
      <input class="task-input" id="taskInput" type="text"
        placeholder="What are you working on?" autocomplete="off"/>
    </div>

    <div class="controls">
      <button class="btn-icon" title="Reset" onclick="resetTimer()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 .49-4.49"></path>
        </svg>
      </button>
      <button class="btn-main" id="mainBtn" onclick="toggleTimer()">Start</button>
      <button class="btn-icon" title="Skip" onclick="skipSession()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 4 15 12 5 20 5 4"></polygon>
          <line x1="19" y1="5" x2="19" y2="19"></line>
        </svg>
      </button>
    </div>

    <div class="sessions" id="sessions">
      <div class="session-dot" id="dot0"></div>
      <div class="session-dot" id="dot1"></div>
      <div class="session-dot" id="dot2"></div>
      <div class="session-dot" id="dot3"></div>
      <span class="session-label" id="sessionLabel">0 / 4 sessions</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
